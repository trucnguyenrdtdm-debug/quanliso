async function api(name,...args){

   state=await api('getDashboard',token);try{layout57=await api('getLayoutV57',token);}catch(e){console.warn('Không tải được bố cục V5.7',e);}applyLayout57();globalTheme52=state.theme||THEME52_DEFAULT;applyTheme52(effectiveTheme52());
   $('login').classList.add('hidden');$('shell').classList.remove('hidden');

$('loginButton').onclick=async()=>{const b=$('loginButton');b.disabled=true;$('loginMsg').textContent='';try{const r=await api('loginPasswordV51',$('loginRole').value,$('loginPassword').value);token=r.token;localStorage.setItem('v51_token',token);$('loginPassword').value='';await refresh();}catch(e){$('loginMsg').textContent=e.message;}finally{b.disabled=false;}};

document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;query='';category='';render();});
function render(){closeMenus55();document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('pageTitle').textContent=({home:'Trang chủ',fav:'Ứng dụng yêu thích',games:'Ngân hàng trò chơi',lessons:'Ngân hàng bài giảng',digital:'Chuyển đổi số',manage:'Quản lý ứng dụng',cats:'Quản lý danh mục',users:'Danh sách tài khoản V5 (lưu trữ)',audit:'Nhật ký thao tác',backup:'Sao lưu dữ liệu',theme:'Tùy chỉnh giao diện',order:'Kéo thả sắp xếp ứng dụng',design:'Thiết kế trang chủ'})[tab];const c=$('content');c.replaceChildren();if(['home','fav','games','lessons','digital'].includes(tab))renderApps(c);else if(tab==='manage')renderManage(c);else if(tab==='cats')renderCats(c);else if(tab==='users')renderUsers(c);else if(tab==='audit')renderAudit(c);else if(tab==='backup')renderBackup(c);else if(tab==='theme')renderTheme52(c);else if(tab==='order')renderOrder54(c);else if(tab==='design')renderDesignV57(c);}
function filtered(){const bank={games:/trò chơi|tro choi|game/i,lessons:/bài giảng|bai giang|giáo án|giao an|học liệu|hoc lieu/i,digital:/chuyển đổi số|chuyen doi so|quản lý|quan ly|điểm danh|diem danh|hồ sơ|ho so|chuyên môn|chuyen mon/i};return state.apps.filter(a=>a.trangThai==='HIEN'&&(tab!=='fav'||state.favorites.includes(a.id))&&(!bank[tab]||bank[tab].test(a.danhMuc+' '+a.ten))&&(!category||a.danhMuc===category)&&(!query||(a.ten+' '+a.moTa+' '+a.danhMuc).toLowerCase().includes(query.toLowerCase())));}
function appTile53(a,preview=false){
 const t=effectiveTheme52(),card=el('article',{class:'app appTile53 '+(t.cardStyle||'cover')+' hover-'+(t.cardHover||'lift')});
 if(a.link&&!preview){card.classList.add('clickable');card.tabIndex=0;card.setAttribute('role','link');card.setAttribute('aria-label','Mở ứng dụng '+a.ten);const go=()=>openAppV56(a);card.onclick=e=>{if(!e.target.closest('.favorite53'))go();};card.onkeydown=e=>{if(e.key==='Enter'&&!e.target.closest('button'))go();};}
 const media=el('div',{class:'tileMedia53'});if(a.cover){const img=el('img',{src:a.cover,alt:'',loading:'lazy'});img.onerror=()=>{img.remove();media.classList.add('noCover53')};media.append(img);}else media.classList.add('noCover53');

function renderApps(c){
 const t=effectiveTheme52();
 const sections={};
 const hero=el('section',{class:'hero53'}),small=el('div',{class:'heroEyebrow53',text:'✨ TRUNG TÂM ỨNG DỤNG SỐ'}),h=el('h2',{class:'heroTitle53'},[el('span',{text:t.heroLine1||'Ứng dụng số trong tầm tay'}),el('span',{class:'heroGradient53',text:t.heroLine2||'Một chạm, mở mọi tiện ích'})]);hero.append(small,h,el('p',{text:t.subtitle||'Khám phá và sử dụng các tiện ích trong một không gian.'}));sections.hero=hero;

function renderDesignV57(c){
 if(state.user.role!=='ADMIN'){c.textContent='Chỉ quản trị viên được thiết kế trang chủ';return;}
 let draft=JSON.parse(JSON.stringify(layout57));const p=el('div',{class:'panel v57-editor'});p.append(el('h3',{text:'🧱 Thiết kế trang chủ V5.7'}),el('p',{class:'muted',text:'Bật/tắt, sắp xếp các khu vực, thay đổi độ rộng và kích thước thẻ. Xem trước trước khi lưu. Dữ liệu ứng dụng không bị thay đổi.'}));

 function draw(){rows.replaceChildren();draft.sections.forEach((s,i)=>{const r=el('div',{class:'v57-editor-row'});const check=el('input',{type:'checkbox'});check.checked=s.visible;check.disabled=s.id==='apps';check.onchange=()=>{s.visible=check.checked;drawPreview();};const name=el('strong',{text:layout57Names[s.id]});const width=el('select');[[100,'100%'],[50,'50%'],[33,'33%'],[25,'25%']].forEach(([v,label])=>width.append(el('option',{value:String(v),text:label})));width.value=String(s.width);width.onchange=()=>{s.width=Number(width.value);drawPreview();};const up=actionButton('↑',()=>move(i,-1),'btn small alt'),down=actionButton('↓',()=>move(i,1),'btn small alt');up.disabled=i===0;down.disabled=i===draft.sections.length-1;r.append(check,name,width,up,down);rows.append(r);});drawPreview();}

 [cols.i,height.i,gap.i,categoryCheck].forEach(x=>x.addEventListener('change',drawPreview));height.i.addEventListener('input',drawPreview);gap.i.addEventListener('input',drawPreview);

function openAppV56(a){

 try{url=new URL(a.link);if(!['https:','http:'].includes(url.protocol))throw Error('URL');}
 catch(e){alert('Đường dẫn ứng dụng không hợp lệ');return;}

 const button=(label,fn)=>{const b=document.createElement('button');b.type='button';b.textContent=label;b.onclick=fn;return b};
 const close=()=>{wrap.remove();document.removeEventListener('keydown',esc)};
